<!DOCTYPE html>
<html lang="es">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Reserva</title>
    <link rel="stylesheet" href="{% static 'usuarios/css/styles.css' %}">
    <link rel="icon" href="{% static 'img/agenda.png' %}" type="image/png" />
</head>

<body>
    <div class="container">
        <h1>Realiza tu reserva</h1>
        <form method="post" action="{% url 'reservas:mostrar_servicios' %}">
            {% csrf_token %}

            <div class="container form">
                <!-- Paso 1: Selección de servicio -->
                <div class="form-section">
                    <h3>1. Selecciona el servicio</h3>
                    <select name="servicio" id="servicio" required>
                        <option value="">-- Seleccione un servicio --</option>
                        {% for servicio in servicios %}
                        <option value="{{ servicio }}">
                            {{ servicio }}
                        </option>
                        {% empty %}
                        <option value="">No hay servicios disponibles</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Paso 2: Selección de día -->
                <div class="form-section">
                    <h3>2. Selecciona el día</h3>
                    <select name="dia" id="dia" required disabled>
                        <option value="">-- Primero seleccione un servicio --</option>
                        {% for dia in dias %}
                        <option value="{{ dia }}">
                            {{ dia }}
                        </option>
                        {% empty %}
                        <option value="">No hay días disponibles</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Paso 3: Selección de horario
                POR CONSTRUIR TOMAR EN CUENTA METRICAS COMO HORARIO INICIO Y HORARIO FIN 
                -->


                <!-- Paso 4: Datos del cliente -->
                <div class="form-section">
                    <h3>4. Datos del cliente</h3>
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nombre" class="form-control" required>

                    <label for="telefono">Teléfono:</label>
                    <input type="tel" name="telefono" id="telefono" class="form-control" required>

                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" class="form-control" required>

                    <label for="observaciones">Observaciones:</label>
                    <textarea name="observaciones" id="observaciones" class="form-control"></textarea>
                </div>

                <div class="button-container">
                    <button type="submit" class="btn-reservar">Reservar</button>
                </div>
            </div>
        </form>
        <div class="button-container" style="text-align: center; margin-top: 20px;">
            <a href="{% url 'base' %}" class="btn-volver">Volver a la Portada</a>
        </div>
    </div>

    <script>
        document.getElementById('servicio').addEventListener('change', async function () {
            const servicio = this.value;
            const selectDias = document.getElementById('dia');

            selectDias.innerHTML = '<option value="">Cargando días...</option>';
            selectDias.disabled = true;

            if (!servicio) {
                selectDias.innerHTML = '<option value="">-- Seleccione un servicio --</option>';
                return;
            }

            try {
                // ¡Asegúrate de incluir el prefijo /reservas/!
                const response = await fetch(`/reservas/get_dias_por_servicio/?servicio=${encodeURIComponent(servicio)}`);

                // Verifica si la respuesta es JSON
                if (!response.headers.get('content-type')?.includes('application/json')) {
                    const errorText = await response.text();
                    throw new Error(`Respuesta no JSON: ${errorText.substring(0, 100)}...`);
                }

                const data = await response.json();

                if (!response.ok) {  // Maneja errores HTTP 4xx/5xx
                    throw new Error(data.error || `Error ${response.status}`);
                }

                // Actualiza el select de días
                if (data.dias?.length > 0) {
                    selectDias.innerHTML = data.dias.map(dia =>
                        `<option value="${dia.value}">${dia.text}</option>`
                    ).join('');
                    selectDias.disabled = false;
                } else {
                    selectDias.innerHTML = '<option value="">No hay días disponibles</option>';
                }
            } catch (error) {
                selectDias.innerHTML = '<option value="">Error al cargar</option>';
                console.error("Error en fetch:", error);
                alert("Error al cargar días. Detalles en consola.");
            }
        });
    </script>


</body>



</html>
