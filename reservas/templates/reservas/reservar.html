<!DOCTYPE html>
<html lang="es">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Reserva</title>
    <link rel="stylesheet" href="{% static 'reservas/css/styles.css' %}">
    <link rel="icon" href="{% static 'img/agenda.png' %}" type="image/png" />

</head>

<body>
    <div class="container">
        <h1>Realiza tu reserva</h1>
        <form method="post" action="{% url 'reservas:mostrar_servicios' %}">
            {% csrf_token %}

            <div class="container form">
                <!-- Paso 1: Selección de servicio -->
                <div class="form-section">
                    <h3>1. Selecciona el servicio</h3>
                    <select name="servicio" id="servicio" required>
                        <option value="">-- Seleccione un servicio --</option>
                        {% for servicio in servicios %}
                        <option value="{{ servicio }}">
                            {{ servicio }}
                        </option>
                        {% empty %}
                        <option value="">No hay servicios disponibles</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Paso 2: Selección de día -->
                <div class="form-section">
                    <h3>2. Selecciona el día</h3>
                    <select name="dia" id="dia" required>
                        <option value="">-- Seleccionar servicio --</option>
                        {% for dia in dias %}
                        <option value="{{ dia }}">
                            {{ dia }}
                        </option>
                        {% empty %}
                        <option value="">No hay días disponibles</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Paso 3: Selección de horario-->

                <div class="form-section">
                    <h3>3. Selecciona el horario</h3>
                    <div class="time-slots-container" id="time-slots">
                        <p>Selecciona primero un servicio y un día para ver los horarios disponibles</p>
                    </div>
                </div>
                
            <div class="days-btn-container">
                <input class="day-btn" id="monday" name="dias_semana" type="checkbox" value="lunes" />
                <label class="day-label" for="monday">Lun</label>

                <input class="day-btn" id="tuesday" name="dias_semana" type="checkbox" value="martes" />
                <label class="day-label" for="tuesday">Mar</label>

                <input class="day-btn" id="wednesday" name="dias_semana" type="checkbox" value="miércoles" />
                <label class="day-label" for="wednesday">Mie</label>

                <input class="day-btn" id="thursday" name="dias_semana" type="checkbox" value="jueves" />
                <label class="day-label" for="thursday">Jue</label>

                <input class="day-btn" id="friday" name="dias_semana" type="checkbox" value="viernes" />
                <label class="day-label" for="friday">Vie</label>

                <input class="day-btn" id="saturday" name="dias_semana" type="checkbox" value="sábado" />
                <label class="day-label" for="saturday">Sab</label>

                <input class="day-btn" id="sunday" name="dias_semana" type="checkbox" value="domingo" />
                <label class="day-label" for="sunday">Dom</label>
            </div>


                <!-- Paso 4: Datos del cliente -->
                <div class="form-section">
                    <h3>4. Datos del cliente</h3>
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nombre" class="form-control" required>

                    <label for="telefono">Teléfono:</label>
                    <input type="tel" name="telefono" id="telefono" class="form-control" required>

                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" class="form-control" required>

                    <label for="observaciones">Observaciones:</label>
                    <textarea name="observaciones" id="observaciones" class="form-control"></textarea>
                </div>

                <div class="button-container">
                    <button type="submit" class="btn-reservar">Reservar</button>
                </div>
            </div>
        </form>
        <div class="button-container" style="text-align: center; margin-top: 20px;">
            <a href="{% url 'base' %}" class="btn-volver">Volver a la Portada</a>
        </div>
    </div>

    <!--Los Script's de JS van en esta parte del HTML -->
    <script src="{% static 'reservas/js/FiltroDias.js' %}"></script>    
</body>

</html>
