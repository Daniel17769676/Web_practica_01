<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portada</title>
   <!-- Título fijo -->

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
      }
    
      /*ANIMACION LOADING */
      .loadingspinner {
        --square: 26px;
        --offset: 30px;
        --duration: 2.4s;
        --delay: 0.2s;
        --timing-function: ease-in-out;
        --in-duration: 0.4s;
        --in-delay: 0.1s;
        --in-timing-function: ease-out;
        width: calc(3 * var(--offset) + var(--square));
        height: calc(2 * var(--offset) + var(--square));
        padding: 0px;
        margin-left: auto;
        margin-right: auto;
        margin-top: 10px;
        margin-bottom: 30px;
        position: relative;
      }

      .loadingspinner div {
        display: inline-block;
        background: rgb(9, 255, 0);
        /*background: var(--text-color);*/
        /*box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.4);*/
        border: none;
        border-radius: 2px;
        width: var(--square);
        height: var(--square);
        position: absolute;
        padding: 0px;
        margin: 0px;
        font-size: 6pt;
        color: black;
      }

      .loadingspinner #square1 {
        left: calc(0 * var(--offset));
        top: calc(0 * var(--offset));
        animation: square1 var(--duration) var(--delay) var(--timing-function)
            infinite,
          squarefadein var(--in-duration) calc(1 * var(--in-delay))
            var(--in-timing-function) both;
      }

      .loadingspinner #square2 {
        left: calc(0 * var(--offset));
        top: calc(1 * var(--offset));
        animation: square2 var(--duration) var(--delay) var(--timing-function)
            infinite,
          squarefadein var(--in-duration) calc(1 * var(--in-delay))
            var(--in-timing-function) both;
      }

      .loadingspinner #square3 {
        left: calc(1 * var(--offset));
        top: calc(1 * var(--offset));
        animation: square3 var(--duration) var(--delay) var(--timing-function)
            infinite,
          squarefadein var(--in-duration) calc(2 * var(--in-delay))
            var(--in-timing-function) both;
      }

      .loadingspinner #square4 {
        left: calc(2 * var(--offset));
        top: calc(1 * var(--offset));
        animation: square4 var(--duration) var(--delay) var(--timing-function)
            infinite,
          squarefadein var(--in-duration) calc(3 * var(--in-delay))
            var(--in-timing-function) both;
      }

      .loadingspinner #square5 {
        left: calc(3 * var(--offset));
        top: calc(1 * var(--offset));
        animation: square5 var(--duration) var(--delay) var(--timing-function)
            infinite,
          squarefadein var(--in-duration) calc(4 * var(--in-delay))
            var(--in-timing-function) both;
      }

      @keyframes square1 {
        0% {
          left: calc(0 * var(--offset));
          top: calc(0 * var(--offset));
        }

        8.333% {
          left: calc(0 * var(--offset));
          top: calc(1 * var(--offset));
        }

        100% {
          left: calc(0 * var(--offset));
          top: calc(1 * var(--offset));
        }
      }

      @keyframes square2 {
        0% {
          left: calc(0 * var(--offset));
          top: calc(1 * var(--offset));
        }

        8.333% {
          left: calc(0 * var(--offset));
          top: calc(2 * var(--offset));
        }

        16.67% {
          left: calc(1 * var(--offset));
          top: calc(2 * var(--offset));
        }

        25.00% {
          left: calc(1 * var(--offset));
          top: calc(1 * var(--offset));
        }

        83.33% {
          left: calc(1 * var(--offset));
          top: calc(1 * var(--offset));
        }

        91.67% {
          left: calc(1 * var(--offset));
          top: calc(0 * var(--offset));
        }

        100% {
          left: calc(0 * var(--offset));
          top: calc(0 * var(--offset));
        }
      }

      @keyframes square3 {
        0%,
        100% {
          left: calc(1 * var(--offset));
          top: calc(1 * var(--offset));
        }

        16.67% {
          left: calc(1 * var(--offset));
          top: calc(1 * var(--offset));
        }

        25.00% {
          left: calc(1 * var(--offset));
          top: calc(0 * var(--offset));
        }

        33.33% {
          left: calc(2 * var(--offset));
          top: calc(0 * var(--offset));
        }

        41.67% {
          left: calc(2 * var(--offset));
          top: calc(1 * var(--offset));
        }

        66.67% {
          left: calc(2 * var(--offset));
          top: calc(1 * var(--offset));
        }

        75.00% {
          left: calc(2 * var(--offset));
          top: calc(2 * var(--offset));
        }

        83.33% {
          left: calc(1 * var(--offset));
          top: calc(2 * var(--offset));
        }

        91.67% {
          left: calc(1 * var(--offset));
          top: calc(1 * var(--offset));
        }
      }

      @keyframes square4 {
        0% {
          left: calc(2 * var(--offset));
          top: calc(1 * var(--offset));
        }

        33.33% {
          left: calc(2 * var(--offset));
          top: calc(1 * var(--offset));
        }

        41.67% {
          left: calc(2 * var(--offset));
          top: calc(2 * var(--offset));
        }

        50.00% {
          left: calc(3 * var(--offset));
          top: calc(2 * var(--offset));
        }

        58.33% {
          left: calc(3 * var(--offset));
          top: calc(1 * var(--offset));
        }

        100% {
          left: calc(3 * var(--offset));
          top: calc(1 * var(--offset));
        }
      }

      @keyframes square5 {
        0% {
          left: calc(3 * var(--offset));
          top: calc(1 * var(--offset));
        }

        50.00% {
          left: calc(3 * var(--offset));
          top: calc(1 * var(--offset));
        }

        58.33% {
          left: calc(3 * var(--offset));
          top: calc(0 * var(--offset));
        }

        66.67% {
          left: calc(2 * var(--offset));
          top: calc(0 * var(--offset));
        }

        75.00% {
          left: calc(2 * var(--offset));
          top: calc(1 * var(--offset));
        }

        100% {
          left: calc(2 * var(--offset));
          top: calc(1 * var(--offset));
        }
      }

      @keyframes squarefadein {
        0% {
          transform: scale(0.75);
          opacity: 0;
        }

        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /*BTN DARK MODE CCS*/
      .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
      }

      .switch #input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #2196f3;
        -webkit-transition: 0.4s;
        transition: 0.4s;
        z-index: 0;
        overflow: hidden;
      }

      .sun-moon {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: yellow;
        -webkit-transition: 0.4s;
        transition: 0.4s;
      }

      #input:checked + .slider {
        background-color: black;
      }

      #input:focus + .slider {
        box-shadow: 0 0 1px #2196f3;
      }

      #input:checked + .slider .sun-moon {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
        transform: translateX(26px);
        background-color: white;
        -webkit-animation: rotate-center 0.6s ease-in-out both;
        animation: rotate-center 0.6s ease-in-out both;
      }

      .moon-dot {
        opacity: 0;
        transition: 0.4s;
        fill: gray;
      }

      #input:checked + .slider .sun-moon .moon-dot {
        opacity: 1;
      }

      .slider.round {
        border-radius: 34px;
      }

      .slider.round .sun-moon {
        border-radius: 50%;
      }

      #moon-dot-1 {
        left: 10px;
        top: 3px;
        position: absolute;
        width: 6px;
        height: 6px;
        z-index: 4;
      }

      #moon-dot-2 {
        left: 2px;
        top: 10px;
        position: absolute;
        width: 10px;
        height: 10px;
        z-index: 4;
      }

      #moon-dot-3 {
        left: 16px;
        top: 18px;
        position: absolute;
        width: 3px;
        height: 3px;
        z-index: 4;
      }

      #light-ray-1 {
        left: -8px;
        top: -8px;
        position: absolute;
        width: 43px;
        height: 43px;
        z-index: -1;
        fill: white;
        opacity: 10%;
      }

      #light-ray-2 {
        left: -50%;
        top: -50%;
        position: absolute;
        width: 55px;
        height: 55px;
        z-index: -1;
        fill: white;
        opacity: 10%;
      }

      #light-ray-3 {
        left: -18px;
        top: -18px;
        position: absolute;
        width: 60px;
        height: 60px;
        z-index: -1;
        fill: white;
        opacity: 10%;
      }

      .cloud-light {
        position: absolute;
        fill: #eee;
        animation-name: cloud-move;
        animation-duration: 6s;
        animation-iteration-count: infinite;
      }

      .cloud-dark {
        position: absolute;
        fill: #ccc;
        animation-name: cloud-move;
        animation-duration: 6s;
        animation-iteration-count: infinite;
        animation-delay: 1s;
      }

      #cloud-1 {
        left: 30px;
        top: 15px;
        width: 40px;
      }

      #cloud-2 {
        left: 44px;
        top: 10px;
        width: 20px;
      }

      #cloud-3 {
        left: 18px;
        top: 24px;
        width: 30px;
      }

      #cloud-4 {
        left: 36px;
        top: 18px;
        width: 40px;
      }

      #cloud-5 {
        left: 48px;
        top: 14px;
        width: 20px;
      }

      #cloud-6 {
        left: 22px;
        top: 26px;
        width: 30px;
      }

      @keyframes cloud-move {
        0% {
          transform: translateX(0px);
        }

        40% {
          transform: translateX(4px);
        }

        80% {
          transform: translateX(-4px);
        }

        100% {
          transform: translateX(0px);
        }
      }

      .stars {
        transform: translateY(-32px);
        opacity: 0;
        transition: 0.4s;
      }

      .star {
        fill: white;
        position: absolute;
        -webkit-transition: 0.4s;
        transition: 0.4s;
        animation-name: star-twinkle;
        animation-duration: 2s;
        animation-iteration-count: infinite;
      }

      #input:checked + .slider .stars {
        -webkit-transform: translateY(0);
        -ms-transform: translateY(0);
        transform: translateY(0);
        opacity: 1;
      }

      #star-1 {
        width: 20px;
        top: 2px;
        left: 3px;
        animation-delay: 0.3s;
      }

      #star-2 {
        width: 6px;
        top: 16px;
        left: 3px;
      }

      #star-3 {
        width: 12px;
        top: 20px;
        left: 10px;
        animation-delay: 0.6s;
      }

      #star-4 {
        width: 18px;
        top: 0px;
        left: 18px;
        animation-delay: 1.3s;
      }

      @keyframes star-twinkle {
        0% {
          transform: scale(1);
        }

        40% {
          transform: scale(1.2);
        }

        80% {
          transform: scale(0.8);
        }

        100% {
          transform: scale(1);
        }
      }

      /* BTN ANIMACION */

      .botones {
        display: flex;
        flex-direction: row; /* Cambia a columna en pantallas pequeñas */
        align-items: center;
        justify-content: center;/* Centra los botones */
        gap: 20px;/* Espacio entre los botones */
      }

      .animated-button {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 16px 36px;
        border: 4px solid;
        border-color: transparent;
        font-size: 16px;
        background-color: inherit;
        border-radius: 100px;
        font-weight: 600;
        color: rgb(4, 7, 1);/* Cambia el color del texto */
        box-shadow: 0 0 0 2px greenyellow;/* Cambia el color del borde */
        cursor: pointer;
        overflow: hidden;
        transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .animated-button svg {
        position: absolute;
        width: 24px;
        fill: greenyellow;/* Cambia el color de la flecha */
        z-index: 9;
        transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .animated-button .arr-1 {
        right: 16px;
      }

      .animated-button .arr-2 {
        left: -25%;
      }

      .animated-button .circle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 20px;
        height: 20px;
        background-color: greenyellow;/* Cambia el color de fondo del botón */
        border-radius: 50%;
        opacity: 0;
        transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .animated-button .text {
        position: relative;
        z-index: 1;
        transform: translateX(-12px);
        transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .animated-button:hover {
        box-shadow: 0 0 0 12px transparent;
        color: #212121;/* Cambia el color del texto al pasar el mouse */
        border-radius: 12px;
      }

      .animated-button:hover .arr-1 {
        right: -25%;
      }

      .animated-button:hover .arr-2 {
        left: 16px;
      }

      .animated-button:hover .text {
        transform: translateX(12px);
      }

      .animated-button:hover svg {
        fill: #212121;
      }

      .animated-button:active {
        scale: 0.95;
        box-shadow: 0 0 0 4px greenyellow;
      }

      .animated-button:hover .circle {
        width: 220px;
        height: 220px;
        opacity: 1;
      }
    </style>

    
  </head>
  <body>
    <!--BTN DARK MODE -->
    <label class="switch">
      <input id="input" type="checkbox" checked="darkTheme" />
      <div class="slider round">
        <div class="sun-moon">
          <svg id="moon-dot-1" class="moon-dot" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="moon-dot-2" class="moon-dot" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="moon-dot-3" class="moon-dot" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="light-ray-1" class="light-ray" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="light-ray-2" class="light-ray" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="light-ray-3" class="light-ray" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>

          <svg id="cloud-1" class="cloud-dark" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="cloud-2" class="cloud-dark" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="cloud-3" class="cloud-dark" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="cloud-4" class="cloud-light" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="cloud-5" class="cloud-light" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
          <svg id="cloud-6" class="cloud-light" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="50"></circle>
          </svg>
        </div>
        <div class="stars">
          <svg id="star-1" class="star" viewBox="0 0 20 20">
            <path
              d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"
            ></path>
          </svg>
          <svg id="star-2" class="star" viewBox="0 0 20 20">
            <path
              d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"
            ></path>
          </svg>
          <svg id="star-3" class="star" viewBox="0 0 20 20">
            <path
              d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"
            ></path>
          </svg>
          <svg id="star-4" class="star" viewBox="0 0 20 20">
            <path
              d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z"
            ></path>
          </svg>
        </div>
      </div>
    </label>

    <!-- Contenido específico de la portada -->
    <h1>Bienvenido a mi página web</h1>
    <h2>Web desde 0</h2>
    <p>Aplicando contenido WEB</p>

    

    <div class="botones">
    <!-- BTN OFRECER SERVICIOS -->  
      <a href="{% url 'disponibilidad' %}" class="animated-button">
        <svg
          viewBox="0 0 24 24"
          class="arr-2"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
        <span class="text">Ofrecer Servicio</span>
        <span class="circle"></span>
        <svg
          viewBox="0 0 24 24"
          class="arr-1"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
      </a>

      <br />

      <!-- BTN RESERVAR SERVICIOS -->
      <a href="{% url 'usuarios:reservar' %}" class="animated-button">
        <svg
         viewBox="0 0 24 24"
          class="arr-2"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
        <span class="text">Reservar Servicio</span>
        <span class="circle"></span>
        <svg
          viewBox="0 0 24 24"
          class="arr-1"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
      </a>
    </div>

    <!-- Este espacio sería para contenido adicional si necesitas incluirlo -->
    <div id="contenido-adicional">
      <!-- Aquí iría el contenido específico si lo necesitas -->
    </div>

    <!-- ANIMACION -->

    <div class="loadingspinner">
      <div id="square1"></div>
      <div id="square2"></div>
      <div id="square3"></div>
      <div id="square4"></div>
      <div id="square5"></div>
    </div>
  </body>
</html>
