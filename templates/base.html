<!DOCTYPE html>
{% load static %}
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas Digital</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="icon" href="{% static 'img/agenda.png' %}" type="image/png">
</head>

<body>
  <div class="holographic-container">
    <div class="holographic-card">
      <div class="holographic-header">
        <h2 class="holographic-title">Sistema reservas <span class="digital">Digital</span></h2>
        <div class="time-display">
          <div class="time" id="live-time">--:--:--</div>
          <div class="date" id="live-date">--- --, ----</div>
        </div>
      </div>


       <!-- BOTONES DE ACCION -->
     
    <div class="botones">
      <!-- btn ofrecer servicios-->
      <a href="{% url 'disponibilidad' %}" class="animated-button">
        <svg
          viewBox="0 0 24 24"
          class="arr-2"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
        <span class="text">Ofrecer Servicio</span>
        <span class="circle"></span>
        <svg
          viewBox="0 0 24 24"
          class="arr-1"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
      </a>

      <br />

      <!-- btn reservar servicios -->
      <a href="{% url 'reservas:reservar' %}" class="animated-button">
        <svg
          viewBox="0 0 24 24"
          class="arr-2"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
        <span class="text">Reservar Servicio</span>
        <span class="circle"></span>
        <svg
          viewBox="0 0 24 24"
          class="arr-1"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
          ></path>
        </svg>
      </a>
    </div>

      <!-- ANIMACION DE CONEXIONES Y TARJETAS -->
      <div class="connection-lines">
        <svg viewBox="0 0 500 200" class="circuit">
          <path class="circuit-path" d="M50,100 Q250,200 450,100" stroke="#4CAF50" fill="none" />
          <circle class="pulse-dot" cx="50" cy="100" r="4" fill="#4CAF50" />
          <circle class="pulse-dot" cx="250" cy="200" r="4" fill="#4CAF50" />
          <circle class="pulse-dot" cx="450" cy="100" r="4" fill="#4CAF50" />
        </svg>
      </div>

      <div class="card-stack">
        <div class="card-3d" style="--i:1">
          <div class="card-content">
            <div class="card-icon">📅</div>
            <h3>Gestión automatica</h3>
            <p>Automatiza tus reservas</p>
          </div>
        </div>
        <div class="card-3d" style="--i:2">
          <div class="card-content">
            <div class="card-icon">⏱️</div>
            <h3>Ahorra tiempo</h3>
            <p>Evita la programacion manual de servicios</p>
          </div>
        </div>
        <div class="card-3d" style="--i:3">
          <div class="card-content">
            <div class="card-icon">🔗</div>
            <h3>Integracion</h3>
            <p>Guarda tus agendamientos en tu correo</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/PaginaDinamica.js"></script>

</body>
</html>
